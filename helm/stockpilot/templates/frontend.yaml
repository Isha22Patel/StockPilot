apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockpilot-frontend
  namespace: stockpilot
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: stockpilot-frontend
  template:
    metadata:
      labels:
        app: stockpilot-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stockpilot-frontend
  namespace: stockpilot
spec:
  type: ClusterIP
  selector:
    app: stockpilot-frontend
  ports:
    - port: 80
      targetPort: 80
