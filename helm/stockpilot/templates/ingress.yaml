apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockpilot-ingress
  namespace: stockpilot
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockpilot-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockpilot-frontend
                port:
                  number: 80
