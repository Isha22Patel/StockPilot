
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stockpilot-postgres-pvc
  namespace: stockpilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockpilot-postgres
  namespace: stockpilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stockpilot-postgres
  template:
    metadata:
      labels:
        app: stockpilot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: stockpilot
            - name: POSTGRES_DB
              value: stockpilot_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockpilot-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: stockpilot-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: stockpilot-postgres
  namespace: stockpilot
spec:
  type: ClusterIP
  selector:
    app: stockpilot-postgres
  ports:
    - port: 5432
      targetPort: 5432
