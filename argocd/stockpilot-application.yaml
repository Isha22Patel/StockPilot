apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Isha22Patel/StockPilot.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
